name: Update Profile

on:
  push:
    branches: [main]
    paths:
      - "config.yml"
      - "templates/**"
      - "scripts/**"
      - "assets/photo.*"
  schedule:
    # Daily at 03:00 UTC — keeps the contribution graph and skills radar fresh
    # even on days you don't touch this repo.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run generators
        working-directory: scripts
        env:
          # PROFILE_TOKEN is a personal access token with "read:user" scope,
          # used to read contribution data via the GitHub GraphQL API.
          # Add it under Settings -> Secrets and variables -> Actions.
          # Falls back to sample data automatically if not set.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python generate_all.py

      - name: Commit and push if changed
        run: |
          git config user.name "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate profile [automated]"
            git push
          fi
